<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title> Mi To-Do</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Input para agregar tarea -->
  <div class="input-container">
    <ion-item>
      <ion-input
        [(ngModel)]="nuevaTarea"
        placeholder="Escribe una tarea..."
        (keyup.enter)="agregarTarea()">
      </ion-input>
    </ion-item>
    <ion-button expand="block" (click)="agregarTarea()" [disabled]="!nuevaTarea.trim()">
      Agregar tarea
    </ion-button>
  </div>

  <!-- Filtros -->
  <ion-segment [(ngModel)]="filtro" (ionChange)="cambiarFiltro()">
    <ion-segment-button value="todas">Todas</ion-segment-button>
    <ion-segment-button value="pendientes">Pendientes</ion-segment-button>
    <ion-segment-button value="completadas">Completadas</ion-segment-button>
  </ion-segment>

  <!-- Lista de tareas -->
  <ion-list>
    <ion-item *ngFor="let tarea of tareasFiltradas" [class.completada]="tarea.completada">
      <ion-checkbox
        slot="start"
        [(ngModel)]="tarea.completada">
      </ion-checkbox>
      <ion-label [class.tachado]="tarea.completada">
        {{ tarea.texto }}
      </ion-label>
      <ion-button slot="end" fill="clear" color="danger" (click)="eliminarTarea(tarea)">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Mensaje si no hay tareas -->
  <div class="empty" *ngIf="tareasFiltradas.length === 0">
    <ion-icon name="checkmark-done-outline"></ion-icon>
    <p>No hay tareas aquí</p>
  </div>

</ion-content>
